# BungeeCord plugin display name.
name: PAL-Proxy
# BungeeCord plugin entrypoint class.
main: com.bitaspire.pal.proxy.bungee.PALBungeePlugin
# Version is expanded by Gradle during resource processing.
version: '${version}'
# Plugin author.
author: CroaBeast

# Optional proxy dependencies. The proxy addon starts without them and enables hooks when present.
# Values:
# - FastLogin: premium login-mode decisions.
# - floodgate: Bedrock login detection.
softDepends:
  - FastLogin
  - floodgate

# Resolved by BungeeCord's LibraryLoader into the proxy's "libraries" folder.
# Keep in sync with ProxyStorageDrivers.
libraries:
  - org.xerial:sqlite-jdbc:3.53.1.0
  - com.mysql:mysql-connector-j:8.0.33
  - org.mariadb.jdbc:mariadb-java-client:3.3.3
  - org.postgresql:postgresql:42.7.3
