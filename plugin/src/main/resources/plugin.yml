# Bukkit plugin entrypoint class.
main: com.bitaspire.pal.PALPlugin

name: PAL
version: '${version}'
prefix: PAL
authors: [ CroaBeast ]
api-version: 1.13

folia-supported: true

# Resolved by the server on 1.16.5+. Older servers ignore this block and fall back to
# StorageDrivers, which downloads the driver on first use. Keep in sync with StorageDrivers.
libraries:
  - org.xerial:sqlite-jdbc:3.53.1.0
  - com.mysql:mysql-connector-j:8.0.33
  - org.mariadb.jdbc:mariadb-java-client:3.3.3
  - org.postgresql:postgresql:42.7.3

softdepend:
  - FastLogin
  - PlaceholderAPI
  - LuckPerms
  - floodgate
  - Geyser-Spigot
  - AuthMe
  - nLogin
  - OpeNLogin
  - LibreLogin
